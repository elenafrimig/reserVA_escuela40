<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    connect-src https://script.google.com https://script.googleusercontent.com;
    form-action 'self';
  ">
  <title>Reserva de Calendario Escolar</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { display: flex; flexDirection: column; width: 300px; gap: 10px; }
    input, button { padding: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Reserva de Recursos Escolares</h2>
  <form id="reservaForm">
    <input type="text" id="profesor" placeholder="Nombre del profesor" required>
    <input type="text" id="recurso" placeholder="Recurso (ej. SamLabs)" required>
    <input type="date" id="fecha" required>
    <input type="time" id="hora" required>
    <button type="submit" id="btnEnviar">Confirmar Reserva</button>
  </form>
  <p id="resultado"></p>

  <script>
    document.getElementById('reservaForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;

      const payload = {
        accion: "reservar",
        profesor: document.getElementById('profesor').value,
        recurso: document.getElementById('recurso').value,
        fecha: document.getElementById('fecha').value,
        hora: document.getElementById('hora').value
      };

      try {
        const respuesta = await fetch("https://script.google.com/macros/s/AKfycbyN9GME4O3C-ralRrhqpvlPtve8WoaIF81SEyDLq_Cu0aFXjM5KondRfdFuoM_F6ah8/exec", {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        const data = await respuesta.json();
        // Uso seguro de textContent para prevenir XSS
        document.getElementById('resultado').textContent = data.mensaje;
      } catch (err) {
        document.getElementById('resultado').textContent = "Error de red al procesar la reserva.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
